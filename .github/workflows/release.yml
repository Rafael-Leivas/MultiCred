name: Release

# Push a tag like v1.0.0 to build, sign, notarize and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 MARKETING_VERSION MultiCred.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          echo "tag=$TAG project=$VERSION"
          [ "$TAG" = "$VERSION" ] || { echo "::error::Tag v$TAG does not match MARKETING_VERSION $VERSION"; exit 1; }

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret: building ad hoc (not notarized)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in certificate"; exit 1; }
          echo "::add-mask::$IDENTITY"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        env:
          DEVELOPER_ID: ${{ steps.signing.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/release.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/MultiCred.zip
            dist/MultiCred.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          NOTES="Download **MultiCred.dmg**, open it and drag MultiCred to Applications.

          Verify the download: \`shasum -a 256 -c SHA256SUMS.txt\`.
          Build provenance: \`gh attestation verify MultiCred.dmg --repo $GITHUB_REPOSITORY\`.
          Full changes in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
          FLAGS=""
          if [ "$SIGNED" != "true" ]; then
            FLAGS="--prerelease"
            NOTES="$NOTES

          > Not signed with a Developer ID: on first open, right-click the app and choose Open."
          fi
          gh release create "$GITHUB_REF_NAME" dist/MultiCred.dmg dist/MultiCred.zip dist/SHA256SUMS.txt \
            --title "MultiCred $GITHUB_REF_NAME" --notes "$NOTES" $FLAGS
