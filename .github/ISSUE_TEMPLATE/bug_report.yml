name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MultiCred version
      description: Menu bar icon › About
    validations: { required: true }
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: "Do not paste tokens or API keys. Logs are in `~/Library/Logs/MultiCred/` and mask login codes."
